apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: robotshop
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/Pritamsingh230/robotshop-gitops.git
    targetRevision: main
    path: overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: robotshop

  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true