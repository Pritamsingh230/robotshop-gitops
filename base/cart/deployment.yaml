apiVersion: apps/v1
kind: Deployment

metadata:
  name: cart
  namespace: robotshop
  labels:
    app: cart

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cart

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: cart

    spec:
      containers:
      - name: cart

        image: us-east1-docker.pkg.dev/ps-devops-project/robotshop/cart:1

        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        env:
        - name: REDIS_HOST
          value: "redis"

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "250m"
            memory: "256Mi"

        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10

        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5