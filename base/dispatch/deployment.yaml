apiVersion: apps/v1
kind: Deployment

metadata:
  name: dispatch
  namespace: robotshop
  labels:
    app: dispatch

spec:
  replicas: 2

  selector:
    matchLabels:
      app: dispatch

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: dispatch

    spec:
      containers:
      - name: dispatch

        image: us-east1-docker.pkg.dev/ps-devops-project/robotshop/dispatch:2

        imagePullPolicy: Always

        env:
        - name: AMQP_HOST
          value: "rabbitmq"

        - name: AMQP_USER
          value: "robotshop"

        - name: AMQP_PASS
          value: "robotshop123"

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "250m"
            memory: "256Mi"