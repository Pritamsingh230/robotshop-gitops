apiVersion: apps/v1
kind: Deployment

metadata:
  name: ratings
  namespace: robotshop
  labels:
    app: ratings

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ratings

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: ratings

    spec:
      containers:
      - name: ratings

        image: us-east1-docker.pkg.dev/ps-devops-project/robotshop/ratings:3

        imagePullPolicy: Always

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "250m"
            memory: "256Mi"

        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 10

        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5