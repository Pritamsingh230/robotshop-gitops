apiVersion: apps/v1
kind: Deployment

metadata:
  name: shipping
  namespace: robotshop
  labels:
    app: shipping

spec:
  replicas: 2

  selector:
    matchLabels:
      app: shipping

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: shipping

    spec:
      containers:
      - name: shipping

        image: us-east1-docker.pkg.dev/ps-devops-project/robotshop/shipping:11

        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        env:
        - name: CART_ENDPOINT
          value: "cart:8080"

        - name: DB_HOST
          value: "mysql"

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10

        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
