apiVersion: apps/v1
kind: Deployment

metadata:
  name: user
  namespace: robotshop
  labels:
    app: user

spec:
  replicas: 2

  selector:
    matchLabels:
      app: user

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: user

    spec:
      containers:
      - name: user

        image: us-east1-docker.pkg.dev/ps-devops-project/robotshop/user:2

        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        env:
        - name: MONGO
          value: "true"

        - name: MONGO_URL
          value: "mongodb://admin:admin123@mongodb:27017"

        - name: REDIS_HOST
          value: "redis"

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "250m"
            memory: "256Mi"

        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10

        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5